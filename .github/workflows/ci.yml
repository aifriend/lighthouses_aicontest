name: CI
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint (syntax + undefined names)
        run: pip install ruff && ruff check --select E9,F63,F7,F82 .
      - name: Byte-compile all sources
        run: python -m compileall -q -x '\.git' .
      - name: Smoke tests (engine + headless match runner, stdlib only)
        run: python -m unittest discover -s tests -v
