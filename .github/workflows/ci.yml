name: CI
on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt pytest==9.2.0 ruff==0.17.5
      - name: Lint (syntax + undefined names)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Byte-compile all sources
        run: python -m compileall -q -x '\.git' .
      - name: Tests
        env:
          SDL_VIDEODRIVER: dummy
        run: pytest -q
